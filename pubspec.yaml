name: deeplink_tools
description: In-app deeplink testing tool. Floating button, env switcher, on-the-fly editing, shareable JSON profiles.
version: 0.1.0
repository: https://github.com/kotakkode/deeplink-tools
issue_tracker: https://github.com/kotakkode/deeplink-tools/issues

environment:
  sdk: ^3.7.2
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.0.5
  path_provider: ^2.0.9
  share_plus: ^12.0.2
  file_picker: ^10.2.0
  url_launcher: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
